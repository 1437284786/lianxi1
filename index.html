<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个简洁、易用并支持本地保存的中文待办事项应用。">
  <title>今日待办</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">专注当下 · 逐项完成</p>
          <h1 id="page-title">今日待办</h1>
          <p class="subtitle" id="today-date"></p>
        </div>
        <div class="header-icon" aria-hidden="true">✓</div>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">输入新的待办事项</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          maxlength="100"
          placeholder="写下接下来要做的事…"
          autocomplete="off"
          required
        >
        <button type="submit" class="add-button" aria-label="添加待办事项">
          <span aria-hidden="true">＋</span>
          <span>添加</span>
        </button>
      </form>

      <div class="list-heading">
        <h2>任务清单</h2>
        <p id="todo-count" aria-live="polite">还没有待办事项</p>
      </div>

      <ul class="todo-list" id="todo-list" aria-label="待办事项列表"></ul>

      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">☀</div>
        <h2>今天也要元气满满</h2>
        <p>添加一项任务，开启高效的一天吧。</p>
      </div>

      <footer class="app-footer">
        <span class="storage-dot" aria-hidden="true"></span>
        数据会自动保存在当前浏览器中
      </footer>
    </section>
  </main>

  <template id="todo-template">
    <li class="todo-item">
      <button type="button" class="toggle-button" aria-label="标记为已完成">
        <span class="checkmark" aria-hidden="true">✓</span>
      </button>
      <span class="todo-text"></span>
      <button type="button" class="delete-button" aria-label="删除待办事项">
        <span aria-hidden="true">×</span>
      </button>
    </li>
  </template>
</body>
</html>
